[project]
name = "sr2"
version = "0.0.1"
description = "SR2 — a context runtime for AI agents: layered context assembly, compaction, memory, token budgeting and continuity"
readme = "README.md"
authors = [{ name = "Diego Camizotti", email = "diego@terminuslabs.co" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "litellm>=1.0,<1.106",
    "aiosqlite>=0.22.1",
    "python-ulid>=3.0",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
sr2 = "sr2.cli:main"

[project.entry-points."sr2.resolvers"]
static = "sr2.pipeline.resolvers.static:StaticResolver"
input = "sr2.pipeline.resolvers.input:InputResolver"
session = "sr2.pipeline.resolvers.session:SessionResolver"
working_set = "sr2.pipeline.resolvers.working_set:WorkingSetResolver"
event_payload = "sr2.pipeline.resolvers.event_payload:EventPayloadResolver"
memory = "sr2.memory.memory_resolver:MemoryResolver"
markdown_file = "sr2.pipeline.resolvers.markdown_file:MarkdownFileResolver"
static_text = "sr2.pipeline.resolvers.static_text:StaticTextResolver"

[project.entry-points."sr2.extractors"]
rule_based = "sr2.memory.extraction:RuleBasedExtractor"

[project.entry-points."sr2.transformers"]
summarize = "sr2.pipeline.transformers.summarization:SummarizationTransformer"
memory_extraction = "sr2.memory.extraction_transformer:MemoryExtractionTransformer"
compaction = "sr2.compaction.transformer:CompactionTransformer"

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=0.25.0", "ruff>=0.15.11"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
asyncio_mode = "auto"
